<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biblioteca Universitária</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <!-- Cabeçalho -->
    <header class="bg-dark text-white py-4">
      <div class="container">
        <h1 class="display-6 fw-bold mb-1">Biblioteca Universitária</h1>
        <p class="lead mb-0">Gerenciamento de livros e revistas do acervo</p>
      </div>
    </header>

    <main class="container py-4">
      <!-- Mensagens de sucesso e erro -->
      <div id="mensagens" aria-live="polite"></div>

      <!-- Resumo / dashboard -->
      <section class="mb-4" aria-labelledby="titulo-resumo">
        <h2 id="titulo-resumo" class="h4 mb-3">Resumo do acervo</h2>
        <div class="row g-3">
          <div class="col-12 col-md-4">
            <div class="card card-resumo border-primary h-100 shadow-sm">
              <div class="card-body text-center">
                <p class="text-secondary mb-1">Total de materiais</p>
                <p id="resumo-total" class="display-5 fw-bold mb-0">0</p>
              </div>
            </div>
          </div>
          <div class="col-6 col-md-4">
            <div class="card card-resumo border-success h-100 shadow-sm">
              <div class="card-body text-center">
                <p class="text-secondary mb-1">Livros</p>
                <p id="resumo-livros" class="display-5 fw-bold mb-0">0</p>
              </div>
            </div>
          </div>
          <div class="col-6 col-md-4">
            <div class="card card-resumo border-warning h-100 shadow-sm">
              <div class="card-body text-center">
                <p class="text-secondary mb-1">Revistas</p>
                <p id="resumo-revistas" class="display-5 fw-bold mb-0">0</p>
              </div>
            </div>
          </div>
        </div>
      </section>

      <div class="row g-4">
        <!-- Listagem -->
        <section class="col-12 col-xl-8" aria-labelledby="titulo-lista">
          <div class="card shadow-sm">
            <div class="card-body p-3 p-md-4">
              <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <h2 id="titulo-lista" class="h4 mb-0">Materiais cadastrados</h2>
                <button id="btn-recarregar" type="button" class="btn btn-primary">Recarregar lista</button>
              </div>

              <!-- Consulta por ID -->
              <form id="form-consulta" class="row g-2 align-items-end mb-4" novalidate>
                <div class="col-12 col-sm">
                  <label for="consulta-id" class="form-label">Consultar material por ID</label>
                  <input id="consulta-id" type="number" min="1" class="form-control" placeholder="Ex.: 1" />
                  <div class="invalid-feedback"></div>
                </div>
                <div class="col-12 col-sm-auto">
                  <button type="submit" class="btn btn-outline-primary w-100">Consultar</button>
                </div>
              </form>

              <div id="lista-materiais" class="row g-3"></div>
            </div>
          </div>
        </section>

        <!-- Cadastro -->
        <section class="col-12 col-xl-4" aria-labelledby="titulo-cadastro">
          <div class="card shadow-sm">
            <div class="card-body p-3 p-md-4">
              <h2 id="titulo-cadastro" class="h4 mb-3">Cadastrar material</h2>

              <ul class="nav nav-pills mb-3" id="abas-cadastro" role="tablist">
                <li class="nav-item" role="presentation">
                  <button class="nav-link active" id="aba-livro" data-bs-toggle="pill" data-bs-target="#painel-livro" type="button" role="tab" aria-controls="painel-livro" aria-selected="true">Livro</button>
                </li>
                <li class="nav-item" role="presentation">
                  <button class="nav-link" id="aba-revista" data-bs-toggle="pill" data-bs-target="#painel-revista" type="button" role="tab" aria-controls="painel-revista" aria-selected="false">Revista</button>
                </li>
              </ul>

              <div class="tab-content">
                <!-- Formulário de livro -->
                <div class="tab-pane fade show active" id="painel-livro" role="tabpanel" aria-labelledby="aba-livro">
                  <form id="form-livro" novalidate>
                    <div class="mb-3">
                      <label for="livro-titulo" class="form-label">Título</label>
                      <input id="livro-titulo" type="text" class="form-control" />
                      <div class="invalid-feedback"></div>
                    </div>
                    <div class="mb-3">
                      <label for="livro-ano" class="form-label">Ano de publicação</label>
                      <input id="livro-ano" type="number" class="form-control" />
                      <div class="invalid-feedback"></div>
                    </div>
                    <div class="mb-3">
                      <label for="livro-autor" class="form-label">Autor</label>
                      <input id="livro-autor" type="text" class="form-control" />
                      <div class="invalid-feedback"></div>
                    </div>
                    <div class="mb-3">
                      <label for="livro-paginas" class="form-label">Número de páginas</label>
                      <input id="livro-paginas" type="number" min="1" class="form-control" />
                      <div class="invalid-feedback"></div>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Cadastrar livro</button>
                  </form>
                </div>

                <!-- Formulário de revista -->
                <div class="tab-pane fade" id="painel-revista" role="tabpanel" aria-labelledby="aba-revista">
                  <form id="form-revista" novalidate>
                    <div class="mb-3">
                      <label for="revista-titulo" class="form-label">Título</label>
                      <input id="revista-titulo" type="text" class="form-control" />
                      <div class="invalid-feedback"></div>
                    </div>
                    <div class="mb-3">
                      <label for="revista-ano" class="form-label">Ano de publicação</label>
                      <input id="revista-ano" type="number" class="form-control" />
                      <div class="invalid-feedback"></div>
                    </div>
                    <div class="mb-3">
                      <label for="revista-edicao" class="form-label">Número da edição</label>
                      <input id="revista-edicao" type="number" min="1" class="form-control" />
                      <div class="invalid-feedback"></div>
                    </div>
                    <div class="mb-3">
                      <label for="revista-mes" class="form-label">Mês de publicação</label>
                      <select id="revista-mes" class="form-select">
                        <option value="">Selecione o mês</option>
                      </select>
                      <div class="invalid-feedback"></div>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Cadastrar revista</button>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <footer class="text-center text-secondary small py-4">
      Trabalho final — Desenvolvimento Web e Mobile I
    </footer>

    <!-- Modal de informações (consulta por ID, descrição e prazo, empréstimo) -->
    <div class="modal fade" id="modal-info" tabindex="-1" aria-labelledby="modal-info-titulo" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title h5" id="modal-info-titulo">Detalhes</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <div class="modal-body">
            <dl id="modal-info-corpo" class="row mb-0"></dl>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal de edição (PUT) -->
    <div class="modal fade" id="modal-edicao" tabindex="-1" aria-labelledby="modal-edicao-titulo" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <form id="form-edicao" novalidate>
            <div class="modal-header">
              <h2 class="modal-title h5" id="modal-edicao-titulo">Editar material</h2>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
              <div class="mb-3">
                <label for="edicao-id" class="form-label">ID (gerado pela API)</label>
                <input id="edicao-id" type="text" class="form-control" readonly />
              </div>
              <div class="mb-3">
                <label for="edicao-tipo" class="form-label">Tipo</label>
                <input id="edicao-tipo" type="text" class="form-control" readonly />
              </div>
              <div class="mb-3">
                <label for="edicao-titulo" class="form-label">Título</label>
                <input id="edicao-titulo" type="text" class="form-control" />
                <div class="invalid-feedback"></div>
              </div>
              <div class="mb-3">
                <label for="edicao-ano" class="form-label">Ano de publicação</label>
                <input id="edicao-ano" type="number" class="form-control" />
                <div class="invalid-feedback"></div>
              </div>

              <!-- Campos só de livro -->
              <div id="edicao-campos-livro">
                <div class="mb-3">
                  <label for="edicao-autor" class="form-label">Autor</label>
                  <input id="edicao-autor" type="text" class="form-control" />
                  <div class="invalid-feedback"></div>
                </div>
                <div class="mb-3">
                  <label for="edicao-paginas" class="form-label">Número de páginas</label>
                  <input id="edicao-paginas" type="number" min="1" class="form-control" />
                  <div class="invalid-feedback"></div>
                </div>
              </div>

              <!-- Campos só de revista -->
              <div id="edicao-campos-revista" class="d-none">
                <div class="mb-3">
                  <label for="edicao-edicao" class="form-label">Número da edição</label>
                  <input id="edicao-edicao" type="number" min="1" class="form-control" />
                  <div class="invalid-feedback"></div>
                </div>
                <div class="mb-3">
                  <label for="edicao-mes" class="form-label">Mês de publicação</label>
                  <select id="edicao-mes" class="form-select"></select>
                  <div class="invalid-feedback"></div>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-primary">Salvar alterações</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
